name: Tests
on: [push]

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Run core tests
        run: |
          sbt core/test

  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Run CLI tests
        run: |
          sbt cli/test

  latex-tests:
    name: LaTeX Tests
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base
      - name: Download boxproof.sty
        run: |
          curl -sSfL https://github.com/YunkaiZhang233/boxproof/raw/refs/heads/main/boxproof.sty -o test/latex/boxproof.sty
      - name: Run LaTeX tests
        run: |
          cd test/latex
          for f in *.tex; do
            if pdflatex -interaction=nonstopmode "$f" > /dev/null; then
              echo "✓ $f latex ok"
            else
              echo "✗ $f latex bad"
              exit 1
            fi
          done

  typst-tests:
    name: Typst Tests
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Run Typst tests
        run: |
          cd test/typst
          for f in *.typ; do
            if typst compile "$f"; then
              echo "✓ $f typst ok"
            else
              echo "✗ $f typst bad"
              exit 1
            fi
          done

  lean-tests:
    name: Lean Tests
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          source $HOME/.elan/env
          lean --version
      - name: Run Lean tests
        run: |
          source $HOME/.elan/env
          cd test/lean
          for f in *.lean; do
            if lean "$f"; then
              echo "✓ $f lean ok"
            else
              echo "✗ $f lean bad"
              exit 1
            fi
          done

  playground-upload:
    name: Publish web ui
    runs-on: ubuntu-latest
    needs: [latex-tests, typst-tests, lean-tests]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Build webui
        run: |
          npm ci
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4
